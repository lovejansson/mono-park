<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />

    <link rel="stylesheet" href="./index.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mono-park</title>
  </head>
  <body>
    <header id="window-header">
      <h1>Mono park</h1>
      <section>
        <button id="btn-play">
          <svg
            class="icon"
            id="ic-play"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="
    M8 2h2v2H8V2Z
    M10 4h2v2h-2V4Z
    M12 6h2v2h-2V6Z
    M14 8h2v2h-2V8Z
    M16 10h2v2h-2v-2Z

    M8 20h2v2H8v-2Z
    M10 18h2v2h-2v-2Z
    M12 16h2v2h-2v-2Z
    M14 14h2v2h-2v-2Z
    M16 12h2v2h-2v-2Z

    M6 2h2v20H6V2Z
  "
            />
          </svg>
          <svg
            class="icon hidden"
            id="ic-pause"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M4 2H10V4H4V2ZM14 2H20V4H14V2ZM4 4H6V22H4V4ZM8 4H10V22H8V4ZM14 4H16V22H14V4ZM18 4H20V22H18V4ZM6 20H8V22H6V20ZM16 20H18V22H16V20Z"
            />
          </svg>
        </button>
        <button id="btn-sound">
          <svg
            class="icon"
            id="ic-sound-on"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2h2v20h-2V2Zm-2 2h2v2h-2V4ZM8 6h2v2H8V6Zm8 0h4v2h-4V6ZM2 8h6v2H2V8Zm18 0h2v8h-2V8ZM2 10h2v6H2v-6Zm14 0h2v4h-2v-4ZM4 14h4v2H4v-2Zm4 2h2v2H8v-2Zm8 0h4v2h-4v-2Zm-6 2h2v2h-2v-2Z"
            />
          </svg>

          <svg
            class="icon hidden"
            id="ic-sound-off"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M12 2h2v20h-2V2Zm-2 2h2v2h-2V4ZM8 6h2v2H8V6ZM2 8h6v2H2V8Zm14 1h2v2h-2V9Zm4 0h2v2h-2V9ZM2 10h2v6H2v-6Zm16 1h2v2h-2v-2Zm-2 2h2v2h-2v-2Zm4 0h2v2h-2v-2ZM4 14h4v2H4v-2Zm4 2h2v2H8v-2Zm2 2h2v2h-2v-2Z"
            />
          </svg>
        </button>
      </section>
      <section>
        <button id="btn-min">
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M5 16h14v3H5v-3Z" />
          </svg>
        </button>
        <button id="btn-max">
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M6 4h12v2h2v12h-2v2H6v-2H4V6h2V4Zm0 4v8h12V8H6Z" />
          </svg></button
        ><button id="btn-close">
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M6 5h3v3h3v3h3V8h3V5h3v3h-3v3h-3v3h3v3h3v3h-3v-3h-3v-3h-3v3H9v3H6v-3h3v-3h3v-3H9V8H6V5Z"
            />
          </svg>
        </button>
      </section>
    </header>
    <div id="div-loading">
      <svg
      class="icon"
        xmlns="http://www.w3.org/2000/svg"
        fill="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          d="M13 22h-2v-6h2v6Zm-6-3H5v-2h2v2Zm12 0h-2v-2h2v2ZM9 17H7v-2h2v2Zm8 0h-2v-2h2v2Zm-9-4H2v-2h6v2Zm14 0h-6v-2h6v2ZM9 9H7V7h2v2Zm8 0h-2V7h2v2Zm-4-1h-2V2h2v6ZM7 7H5V5h2v2Zm12 0h-2V5h2v2Z"
        />
      </svg>
    </div>
    <main id="art-container"></main>

    <dialog id="dialog-error">
      <div>
        <header><h2>Error</h2></header>
        <main>
          <p>Oh no, something crashed!</p>
          <svg
            class="icon"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M20 22H4v-2h16v2ZM4 20H2v-6H0v-2h2V8h2v12Zm18-8h2v2h-2v6h-2V8h2v4Zm-12 6H8v-2h2v2Zm6 0h-2v-2h2v2Zm-2-2h-4v-2h4v2Zm-4-4H8v-2h2v2Zm6 0h-2v-2h2v2Zm-3-6h7v2H4V6h7V4h2v2Zm4-2h-4V2h4v2Z"
            />
          </svg>
        </main>
        <footer>
          <button id="btn-reload">
            Reload
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M10 16h10v2H10v4H8v-2H6v-2H4v-2h2v-2h2v-2h2v4Zm12 0h-2v-5h2v5ZM4 13H2V8h2v5Zm12-9h2v2h2v2h-2v2h-2v2h-2V8H4V6h10V2h2v2Z"
              />
            </svg>
          </button>
        </footer>
      </div>
    </dialog>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
